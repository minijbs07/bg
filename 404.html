<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Abrir en BusGo!</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
      color: #f7fbff; background:
        radial-gradient(circle at 80% 10%, rgba(44, 190, 255, .34), transparent 34%),
        radial-gradient(circle at 12% 88%, rgba(66, 233, 161, .22), transparent 32%),
        #07111f;
    }
    main {
      width: min(100%, 520px); padding: 34px; border: 1px solid rgba(255,255,255,.16);
      border-radius: 30px; background: rgba(255,255,255,.09);
      box-shadow: 0 28px 80px rgba(0,0,0,.42); backdrop-filter: blur(24px);
    }
    .mark {
      width: 62px; height: 62px; display: grid; place-items: center; border-radius: 18px;
      font-size: 29px; font-weight: 850; letter-spacing: -2px;
      color: #07111f; background: linear-gradient(145deg, #69f5bc, #3ac8ff);
    }
    h1 { margin: 24px 0 10px; font-size: clamp(30px, 8vw, 46px); letter-spacing: -1.8px; }
    p { margin: 0; color: rgba(247,251,255,.72); line-height: 1.55; }
    .actions { display: grid; gap: 12px; margin-top: 28px; }
    a, button {
      width: 100%; min-height: 52px; display: grid; place-items: center; border: 0; border-radius: 16px;
      font: inherit; font-weight: 720; cursor: pointer; text-decoration: none;
    }
    .primary { color: #07111f; background: linear-gradient(135deg, #69f5bc, #3ac8ff); }
    .secondary { color: #f7fbff; background: rgba(255,255,255,.11); }
    small { display: block; margin-top: 22px; color: rgba(247,251,255,.42); overflow-wrap: anywhere; }
  </style>
  <script>
    (function () {
      var match = window.location.pathname.match(/\/preview\/(\d+)\/?$/);
      if (match) {
        window.location.replace('/bg/preview/?stop=' + match[1]);
      }
    })();

    function legacyFallback() {
      var parts = window.location.pathname.split('/').filter(Boolean);
      if (parts[0] === 'bg') parts.shift();
      var route = parts.shift() || 'hub';
      var tail = decodeURIComponent(parts.join('/'));
      var query = window.location.search || '';
      var url;

      if (route === 'stop' && tail) {
        url = 'tusapp://stop?id=' + encodeURIComponent(tail);
      } else if ((route === 'route' || route === 'pattern') && tail) {
        url = 'tusapp://route?id=' + encodeURIComponent(tail);
      } else if (route === 'journey') {
        url = 'tusapp://onjourney' + query;
      } else {
        url = 'tusapp://' + encodeURIComponent(route) + query;
      }
      window.location.href = url;
    }

    function copyLink(button) {
      navigator.clipboard.writeText(window.location.href).then(function () {
        button.textContent = 'Enlace copiado';
      });
    }
  </script>
</head>
<body>
  <main>
    <div class="mark">BG</div>
    <h1>Continúa en BusGo!</h1>
    <p>Este enlace abre directamente la parada, ruta o función compartida cuando BusGo! está instalada.</p>
    <div class="actions">
      <button class="primary" onclick="legacyFallback()">Abrir BusGo!</button>
      <a class="secondary" href="https://apps.apple.com/es/app/busgo/id6753916938">Descargar en App Store</a>
      <button class="secondary" onclick="copyLink(this)">Copiar enlace</button>
    </div>
    <small id="address"></small>
  </main>
  <script>document.getElementById('address').textContent = window.location.href;</script>
</body>
</html>
